name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Description/topics are GitHub repository settings, only required for
          # inclusion in the default HACS store (not for custom repositories).
          ignore: "description topics"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt pytest-homeassistant-custom-component
      - name: Install requirements of the HA components we depend on (bluetooth, usb, …)
        run: |
          python scripts/ha_component_requirements.py > ha_reqs.txt
          cat ha_reqs.txt
          pip install -r ha_reqs.txt
      - run: pytest -q tests/test_ha_integration.py
